<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Consola administrativa | ViMod</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body class="min-h-screen bg-stone-50 font-['Nunito_Sans'] text-slate-900">
    <style>
      .admin-tabs button[aria-selected="true"] {
        border-color: #315b43;
        background: #315b43;
        color: #fff;
      }
      .admin-tabs button:focus-visible,
      #admin-content button:focus-visible,
      #admin-content input:focus-visible,
      #admin-content select:focus-visible {
        outline: 3px solid #8da995;
        outline-offset: 2px;
      }
      #admin-content table tbody tr:hover { background: #f8faf8; }
      @media (max-width: 640px) {
        #admin-content { padding: 1rem; }
      }
    </style>
    <header class="sticky top-0 z-10 border-b border-stone-200 bg-white">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
        <div><a href="/Backend/Nucleo/Frontend/Vistas/2.%20Inicio%20de%20sesion.html" class="font-['Literata'] text-xl font-bold text-emerald-900">ViMod</a><span class="ml-3 border-l border-stone-300 pl-3 text-sm text-slate-600">Consola administrativa</span></div>
        <div class="flex items-center gap-3"><span id="admin-identity" class="hidden text-sm font-semibold text-slate-700 sm:inline"></span><button id="admin-logout" type="button" class="rounded-md border border-stone-300 px-3 py-2 text-sm font-bold hover:bg-stone-100">Cerrar sesión</button></div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-8">
      <div id="admin-error" class="mb-3 hidden border-l-4 border-red-700 bg-red-50 p-4 text-sm text-red-900" role="alert" aria-live="assertive"></div>
      <div id="admin-notice" class="mb-3 hidden border-l-4 border-emerald-800 bg-emerald-50 p-4 text-sm text-emerald-950" role="status" aria-live="polite"></div>
      <section class="mb-6">
        <p class="text-xs font-bold uppercase tracking-widest text-emerald-900">Administración · ViMod</p>
        <h1 class="mt-1 font-['Literata'] text-3xl font-bold">Operación de la plataforma</h1>
        <p class="mt-2 max-w-3xl text-slate-600">Gestione cuentas y solicitudes; consulte la actividad registrada. El acceso y cada operación se validan en el servidor.</p>
      </section>
      <nav class="admin-tabs mb-5 flex gap-1 overflow-x-auto border-b border-stone-300 pb-2" aria-label="Secciones administrativas" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-section="overview" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Resumen</button>
        <button type="button" role="tab" aria-selected="false" data-section="users" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Usuarios</button>
        <button type="button" role="tab" aria-selected="false" data-section="requests" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Solicitudes de rol</button>
        <button type="button" role="tab" aria-selected="false" data-section="projects" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Proyectos</button>
        <button type="button" role="tab" aria-selected="false" data-section="orders" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Pedidos</button>
        <button type="button" role="tab" aria-selected="false" data-section="reviews" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Revisiones</button>
        <button type="button" role="tab" aria-selected="false" data-section="services" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Servicios</button>
        <button type="button" role="tab" aria-selected="false" data-section="quotes" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Cotizaciones</button>
        <button type="button" role="tab" aria-selected="false" data-section="advisor" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Asesoría técnica</button>
        <button type="button" role="tab" aria-selected="false" data-section="payments" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Operaciones</button>
        <button type="button" role="tab" aria-selected="false" data-section="audit" class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-bold text-slate-700 hover:bg-stone-100">Auditoría</button>
      </nav>
      <section id="admin-content" class="min-h-64 border border-stone-200 bg-white p-5 sm:p-7" aria-live="polite" aria-busy="true">
        <p class="text-slate-500">Cargando información administrativa…</p>
      </section>
    </main>
    <script src="/Backend/Nucleo/Frontend/Scripts/api-client.js"></script>
    <script src="/Backend/Nucleo/Frontend/Scripts/rutas.js"></script><script src="/Backend/Paquetes/Presentacion/PanelAdmin/Scripts/page-admin-dashboard.js?v=3"></script>
  </body>
</html>
